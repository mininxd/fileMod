name: Download Mods

on:
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    permissions: write-all
    steps:
      - uses: actions/checkout@v4

      - name: Generate tag and release name
        run: |
          TAG="build-${{ github.run_number }}"
          NAME="Strava-Signed-${TAG}-$(date +%s)"
          echo "TAG=$TAG" >> $GITHUB_ENV
          echo "RELEASE_NAME=$NAME" >> $GITHUB_ENV

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y wget zip

      - name: Ask for desired output filename
        id: filename
        run: |
          echo "Enter the filename you want (example: strava-437.11-signed.apk):"
          read USER_FILE
          echo "FILE_NAME=$USER_FILE" >> $GITHUB_ENV

      - name: Ask for download URL
        id: url
        run: |
          echo "Enter the URL to download:"
          read USER_URL
          echo "DOWNLOAD_URL=$USER_URL" >> $GITHUB_ENV

      - name: Confirm before starting download
        run: |
          echo "Press ENTER to start downloading..."
          read

      - name: Download file
        run: wget -O "${{ env.FILE_NAME }}" "${{ env.DOWNLOAD_URL }}"

      - name: Create GitHub Release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ env.TAG }}
          release_name: ${{ env.RELEASE_NAME }}
          draft: false
          prerelease: false

      - name: Upload to Release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: ${{ env.FILE_NAME }}
          tag: ${{ env.TAG }}
          overwrite: true
