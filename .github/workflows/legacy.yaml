name: Download LegacyPatch

on:
  workflow_dispatch:

jobs:
  run:
    permissions: write-all
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt update
          sudo apt install -y curl wget unzip zip

      - name: Download Files
        run: |
          wget -O patches-legacy-5.6.2.rvp "https://www.dropbox.com/scl/fi/x1xi4bo5whmw0kjkho85n/patches-5.6.2.rvp?rlkey=o6xxay3hikecv7mtkzfllmlkh&st=lcd2hwov&dl=1"
          ls -lh

      - name: Upload to Release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: patches-legacy-5.6.2.rvp
          tag: 1.0.5
          release_name: APK Release
          body: test
          overwrite: true
          
