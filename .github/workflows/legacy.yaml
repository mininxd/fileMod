name: Download LegacyPatch
on:
  workflow_dispatch:
jobs:
  run:
    permissions: write-all
    runs-on: ubuntu-latest
    steps:
      - name: Install Dependencies
        run: |
          sudo apt install -y curl wget unzip zip

      - name: Download Files
        run: |
          sudo wget "https://www.dropbox.com/scl/fi/x1xi4bo5whmw0kjkho85n/patches-5.6.2.rvp?rlkey=o6xxay3hikecv7mtkzfllmlkh&st=lcd2hwov&dl=1"
          tree ./
          mv "patches-5.6.2.rvp?rlkey=o6xxay3hikecv7mtkzfllmlkh&st=lcd2hwov&dl=1" patches-legacy-5.6.2.rvp
          tree ./

      - name: Upload to Release
        uses: svenstaro/upload-release-action@v2
        with:
          body: |
            test
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: ./*.rvp
          release_name: APK Release
          tag: 1.0.5
          file_glob: true
          overwrite: true
