name: Download Strava and Release

on:
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    permissions: write-all
    steps:
      - uses: actions/checkout@v4

      - name: Generate tag and release name
        run: |
          TAG="build-${{ github.run_number }}"
          NAME="Strava-Signed-${TAG}-$(date +%s)"
          echo "TAG=$TAG" >> $GITHUB_ENV
          echo "RELEASE_NAME=$NAME" >> $GITHUB_ENV

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y wget zip

      - name: Download file
        run: wget -O strava-437.11-signed.apk "https://www.dropbox.com/scl/fi/h7gm4b90vdoiumey8vmr8/Strava_437.11.apk?rlkey=nhjcz1hbomz8qdvl6domwcxx7&st=zof1ggu1&dl=1"

      - name: Create GitHub Release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ env.TAG }}
          release_name: ${{ env.RELEASE_NAME }}
          body: Auto-generated release for ${{ env.TAG }}
          draft: false
          prerelease: false

      - name: Upload to Release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: strava-437.11.signed.apk
          tag: ${{ env.TAG }}
          body: |
            __Strava v416.14 Premium__

            > __FEATURES__
            >  Premium Features, Routes, Replay, Matched Run, Segment Efforts, Map Style
            >  Remove Subscription Suggestion
          overwrite: true
          
